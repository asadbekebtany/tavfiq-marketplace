# Netlify App — Git orqali deploy (Drop/ZIP ishlamaydi: bu Next.js + Prisma).
# Site settings → Environment variables ga secretlarni qo‘ying.

[build]
  command = "npx prisma generate && npx next build --webpack"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Demo (baza yo‘q): development. Haqiqiy PostgreSQL bo‘lsa production qiling.
  APP_ENV = "development"
  NEXT_PUBLIC_APP_ENV = "development"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
